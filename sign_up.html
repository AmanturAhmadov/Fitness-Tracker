<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>

</head>

<body>

    <main>

        <header class="bg-blue-50 pb-4">

            <h3 class="ml-1 font-semibold text-blue-700">
                FitTrack
            </h3>

            <h1 class="text-2xl font-semibold text-center mt-10 mb-1">
                Create your account
            </h1>
            <p class="text-center text-sm text-gray-500">
                Start building healthy habits today
            </p>

        </header>

        <section class="p-4">

            <h2 class="font-semibold">Your details</h2>

            <p class="text-gray-500 text-xs mt-2">Full name</p>
            <input class="border border-gray-300 rounded-lg w-full h-8 p-1 text-xs" type="text" placeholder="Enter your name">

            <p class="text-gray-500 text-xs mt-2">Email address</p>
            <input class="border border-gray-300 rounded-lg w-full h-8 p-1 text-xs" type="text" placeholder="Enter your email">

            <p class="text-gray-500 text-xs mt-2">Password</p>
            <input class="border border-gray-300 rounded-lg w-full h-8 p-1 text-xs" type="password">

            <p class="text-gray-500 text-xs mt-2">Confirm password</p>
            <input class="border border-gray-300 rounded-lg w-full h-8 p-1 text-xs" type="password">

        </section>

        <button class="bg-blue-600 text-white">Create Account</button>

    </main>

</body>

</html>
