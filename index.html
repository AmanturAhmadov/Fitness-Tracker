<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-white text-black p-4">

    <main>

        <header class="bg-blue-950 p-4 mb-4 rounded-2xl text-white flex justify-between">
            <div>
                <h1 class="text-xl font-bold">FitTrack</h1>
                <p class="test-xs">Your daily fitness dashboard</p>
            </div>

            <a href="profile.html">
                <img src="assets/user_icon.png" class="w-6 h-6">
            </a>

        </header>

        <section>
            <h3 class="text-l font-bold" >Good morning!</h3>
            <p class="text-xs mb-6 text-gray-700">Here's your activity for today.</p>
        </section>

        <section class="grid grid-cols-3 gap-4 mb-6 ml-64 flex justify-center items-center">

            <div>
                <img src="assets/footstep.png" class="w-6 h-6">
                <p class="text-xs text-gray-500">Steps</p>
                <p class="text-l">4,500</p>
                <p class="text-xs text-gray-500">of 8,000</p>
            </div>
                
            <div>
                <img src="assets/calories_icon.png" class="w-6 h-6">
                <p class="text-xs text-gray-500">Calories</p>
                <p class="text-l">158</p>
                <p class="text-xs text-gray-500">estimated</p>
            </div>

            <div>
                <img src="assets/active_icon.png" class="w-6 h-6">
                <p class="text-xs text-gray-500">Active</p>
                <p class="text-l">25</p>
                <p class="text-xs text-gray-500">minutes today</p>                
            </div>

        </section>

        <section class="border border-gray-300 rounded-md p-4">

            <div class="flex justify-between">
                <h2 class="font-bold text-l">Daily step goal</h2>
                <span class="text-gray-500 text-xs">56% complete</span>
            </div>


            <div class="bg-gray-100 w-full h-2 rounded-full mt-2 mb-2">
                <div class="bg-blue-500 w-3/5 h-2 rounded-full mt-2 mb-2"></div>
            </div>

                <p class="text-gray-500 text-xs mb-4">Goal: 8,000 steps</p>

            <div class="flex justify-between">
                <div class="ml-64">
                    <p class="ml-8">+</p>
                    <button>Add steps</button>
                </div>
                
                <div class="mr-64">
                    <p class="ml-7">!</p>
                    <button>Edit goal</button>
                </div>
            </div>

        </section>

        <section class="border border-gray-300 rounded-md p-4 mt-4">

            <h2 class="font-bold text-l mb-1">Daily habits</h2>
            <p class="text-gray-500 text-xs mb-4">Check off your completed activities.</p>

            <div>

                <label>
                    <input type="checkbox">
                    <span>Drink water</span>
                </label>

                <hr class="my-4">
                
                <label>
                    <input type="checkbox">
                    <span>Take a walk</span>
                </label>
                
                <hr class="my-4">
                
                <label>
                    <input type="checkbox">
                    <span>Stretch for 5 minutes</span>
                </label>

                <hr class="my-4">

            </div>

            <p class="text-gray-500 text-xs mb-2 mt-4">Completed: 0 of 3</p>

        </section>

    </main>

</body>
    
</html>
