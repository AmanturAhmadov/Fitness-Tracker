<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-white text-black p-4">

    <main>

        <header class="bg-blue-950 p-4 mb-4 rounded-2xl text-white flex justify-between">
            <div>
                <h1 class="text-xl font-bold">FitTrack</h1>
                <p class="test-xs">Your daily fitness dashboard</p>
            </div>
            <img src="assets/user_icon.png" class="w-6 h-6">
        </header>

        <section>
            <h3 class="text-l font-bold" >Good morning!</h3>
            <p class="text-xs mb-6 text-gray-700">Here's your activity for today.</p>
        </section>

        <section class="grid grid-cols-3 gap-4 mb-6 flex justify-center items-center">

            <div >
                <img src="assets/footstep.png" class="w-6 h-6">
                <p class="text-xs text-neutral-500">Steps</p>
                <p class="text-l">4,500</p>
                <p class="text-xs text-neutral-500">Daily step count</p>
            </div>
                
            <div>
                <img src="assets/calories_icon.png" class="w-6 h-6">
                <p class="text-xs text-neutral-500">Calories</p>
                <p class="text-l">158</p>
                <p class="text-xs text-neutral-500">Estimated calories</p>
            </div>

            <div>
                <img src="assets/active_icon.png" class="w-6 h-6">
                <p class="text-xs text-neutral-500">Active minutes</p>
                <p class="text-l">25</p>
                <p class="text-xs text-neutral-500">Minutes active today</p>                
            </div>

        </section>

        <section>

            <div>
                <h2>Daily step goal</h2>
                <span>52%</span>
                <p>Goal: 8,000 steps</p>

                <div>
                    <button>Add 500 steps</button>
                    <button>Edit Goal</button>
                </div>
            </div>

        </section>

        <section>

            <h2>Daily habits</h2>

            <div>

                <label>
                    <input type="checkbox">
                    <span>Drink water</span>
                </label>

                <label>
                    <input type="checkbox">
                    <span>Take a walk</span>
                </label>

                <label>
                    <input type="checkbox">
                    <span>Stretch for 5 minutes</span>
                </label>

            </div>

            <p>Completed: 0 of 3</p>

            <button>Reset tracker</button>

        </section>

    </main>

</body>
    
</html>
