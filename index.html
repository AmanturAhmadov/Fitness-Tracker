<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <main>

        <header>
            <h1>FitTrack</h1>
            <p>Your daily fitness dashboard</p>
        </header>

        <section>
            <h3>Good morning!</h3>
            <p>Here's your activity for today.</p>
        </section>

        <section>

            <div>
                <p>Steps</p>
                <p>4,500</p>
                <p>Daily step count</p>
            </div>
                
            <div>
                <p>Calories</p>
                <p>158</p>
                <p>Estimated calories</p>
            </div>

            <div>
                <p>Active minutes</p>
                <p>25</p>
                <p>Minutes active today</p>                
            </div>

        </section>

        <section>

            <div>
                <h2>Daily step goal</h2>
                <span>52%</span>
                <p>Goal: 8,000 steps</p>

                <div>
                    <button>Add 500 steps</button>
                    <button>Edit Goal</button>
                </div>
            </div>

        </section>

        <section>

            <h2>Daily habits</h2>

            <div>

                <label>
                    <input type="checkbox">
                    <span>Drink water</span>
                </label>

                <label>
                    <input type="checkbox">
                    <span>Take a walk</span>
                </label>

                <label>
                    <input type="checkbox">
                    <span>Stretch for 5 minutes</span>
                </label>

            </div>

            <p>Completed: 0 of 3</p>

            <button>Reset tracker</button>

        </section>

    </main>

</body>
    
</html>
